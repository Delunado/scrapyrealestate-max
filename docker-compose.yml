services:
  scrapyrealestate:
    build:
      context: .
      dockerfile: Dockerfile
    image: scrapyrealestate:local
    container_name: scrapyrealestate
    restart: always
    init: true
    ports:
      - "${SCRAPYREALESTATE_WEB_PORT:-8080}:8080"
    environment:
      SCRAPYREALESTATE_DATA_DIR: /var/lib/scrapyrealestate
    volumes:
      - scrapyrealestate-data:/var/lib/scrapyrealestate

volumes:
  scrapyrealestate-data:
    name: ${SCRAPYREALESTATE_DATA_VOLUME:-scrapyrealestate-data}
