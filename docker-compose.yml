services:
  scrapyrealestate:
    build:
      context: .
      dockerfile: Dockerfile
    image: scrapyrealestate:local
    restart: unless-stopped
    init: true
    ports:
      - "${SCRAPYREALESTATE_WEB_PORT:-8080}:8080"
    environment:
      SCRAPYREALESTATE_DATA_DIR: /var/lib/scrapyrealestate
      SCRAPYREALESTATE_PAGE_LIMIT: "${SCRAPYREALESTATE_PAGE_LIMIT:-5}"
      SCRAPYREALESTATE_RESULT_LIMIT: "${SCRAPYREALESTATE_RESULT_LIMIT:-150}"
    volumes:
      - scrapyrealestate-data:/var/lib/scrapyrealestate
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  scrapyrealestate-data:
    name: ${SCRAPYREALESTATE_DATA_VOLUME:-scrapyrealestate-data}
