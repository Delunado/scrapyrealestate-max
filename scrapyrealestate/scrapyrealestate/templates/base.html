<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ScrapyRealEstate{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('ui.dashboard') }}">ScrapyRealEstate</a>
    <nav aria-label="Navegación principal">
      <a href="{{ url_for('ui.dashboard') }}">Panel</a>
      <a href="{{ url_for('ui.search_list') }}">Búsquedas</a>
      <a href="{{ url_for('ui.channel_list') }}">Notificaciones</a>
    </nav>
  </header>
  <main class="container">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash flash-{{ category }}" role="status">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
