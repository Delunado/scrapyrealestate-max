{% macro errors_for(errors, field) -%}
  {% if errors.get(field) %}
    <ul class="errors" id="{{ field }}-errors">
      {% for error in errors[field] %}<li>{{ error }}</li>{% endfor %}
    </ul>
  {% endif %}
{%- endmacro %}

{% macro csrf() -%}
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{%- endmacro %}
