<!doctype html>
<html lang="es">
  <body>
    <!--
      Sanitized Pisos.com result-card excerpt captured on 2026-09-02.
      Listing identifiers, addresses, and prices are deliberately fictional.
    -->
    <div class="ad-preview__info">
      <a
        class="ad-preview__title"
        href="/comprar/piso-madrid_centro-12345678901_100500/"
      >
        Piso en calle de Alcalá, 12
      </a>
      <p class="p-sm">Sol (Distrito Centro. Madrid)</p>
      <span class="ad-preview__price">325.000 €</span>
      <p class="ad-preview__char p-sm">2ª planta</p>
      <p class="ad-preview__char p-sm">92 m²</p>
      <p class="ad-preview__char p-sm">3 hab.</p>
    </div>

    <!-- Optional location, price, and room fields are absent. -->
    <div class="ad-preview__info">
      <a
        class="ad-preview__title"
        href="/comprar/atico-madrid_retiro-99887766554_100500/"
      >
        Ático en Retiro
      </a>
      <p class="ad-preview__char p-sm">45 m²</p>
      <p class="ad-preview__char p-sm">Bajo</p>
    </div>

    <!-- A repeated listing can occur in promoted and organic result slots. -->
    <div class="ad-preview__info">
      <a
        class="ad-preview__title"
        href="/comprar/piso-madrid_centro-12345678901_100500/"
      >
        Piso repetido
      </a>
      <span class="ad-preview__price">999.999 €</span>
    </div>

    <!-- Promotion cards share the wrapper but do not have a listing URL. -->
    <div class="ad-preview__info">
      <span class="ad-preview__title">Promoción sin enlace</span>
    </div>
  </body>
</html>
