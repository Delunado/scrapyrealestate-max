[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["scrapyrealestate"]
testpaths = ["tests"]
markers = [
    "deployment: opt-in Docker Compose deployment smoke test",
    "live: opt-in tests that make real portal requests",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
